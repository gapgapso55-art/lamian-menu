<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主面人 · 青海拉面</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8f8f8; color: #333; padding-bottom: 80px; }
  .header { background: #fff; text-align: center; padding: 20px 15px 15px; position: relative; }
  .mascot-wrap { margin-bottom: 8px; }
  .mascot-img { width: 70px; height: 70px; border-radius: 50%; background: #f0f4ff; }
  .logo-img { height: 60px; }
  .sub-title { font-size: 15px; letter-spacing: 4px; color: #1e3a8a; font-weight: bold; margin-top: 5px; }
  .halal-tag { font-size: 13px; color: #1e3a8a; margin-top: 5px; }
  
  .nav { display: flex; gap: 8px; padding: 12px; background: #fff; overflow-x: auto; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #eee; }
  .nav-item { padding: 6px 14px; border-radius: 20px; font-size: 14px; color: #666; white-space: nowrap; cursor: pointer; border: 1px solid #ddd; background: #fff; }
  .nav-item.active { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
  
  .vip-row { display: flex; gap: 8px; padding: 12px; background: #fff; overflow-x: auto; }
  .vip-card { flex: 1; min-width: 90px; padding: 10px 5px; border: 1px solid #1e3a8a; border-radius: 8px; text-align: center; cursor: pointer; background: #fff; color: #1e3a8a; }
  .vip-card.active { background: #1e3a8a; color: #fff; }
  .vip-name { font-weight: bold; font-size: 15px; }
  .vip-desc { font-size: 11px; margin-top: 3px; opacity: 0.8; }
  
  .combo-box { background: #fff; margin: 12px; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f0f0f0; }
  .combo-title { font-size: 17px; font-weight: bold; margin-bottom: 8px; color: #1e3a8a; }
  .combo-item { border-top: 1px solid #f5f5f5; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  
  .menu { padding: 10px; display: grid; gap: 12px; }
  .card { background: #fff; border-radius: 12px; display: flex; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f0f0f0; }
  .card-img { width: 105px; height: 105px; object-fit: cover; background: #f8f8f8; }
  .card-body { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; justify-content: space-between; }
  .card-title { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 5px; color: #222; }
  .tag { font-size: 11px; background: #eef2fa; color: #1e3a8a; padding: 2px 6px; border-radius: 4px; font-weight: normal; }
  .price-wrap { font-size: 13px; color: #999; }
  .price { color: #1e3a8a; font-weight: bold; font-size: 18px; margin-left: 5px; }
  .add-btn { float: right; background: #1e3a8a; color: #fff; width: 32px; height: 32px; border-radius: 50%; border: none; font-size: 18px; line-height: 32px; text-align: center; cursor: pointer; }
  
  .checkout { position: fixed; bottom: 15px; left: 15px; right: 15px; background: #1e3a8a; color: #fff; text-align: center; padding: 14px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(30,58,138,0.4); z-index: 20; }
</style>
</head>
<body>

<div class="header">
  <div class="mascot-wrap">
    <img src="https://image.pollinations.ai/prompt/A%20cute%20white%20yak%20mascot%20wearing%20blue%20hat%2C%20logo%20style%2C%20clean%20background?width=100&height=100&nologo=true" class="mascot-img" alt="吉祥物🐼🔥">
  </div>
  <div>
    <img src="https://image.pollinations.ai/prompt/%E4%B8%BB%E9%9D%A2%E4%BA%BA%20logo%2C%20chinese%20noodle%20brand%2C%20black%20calligraphy%20text%20with%20noodle%20graphic?width=200&height=80&nologo=true" class="logo-img" alt="主面人">
  </div>
  <div class="sub-title">千 年 传 承 一 碗 面</div>
  <div class="halal-tag">✦ 青海拉面 · 清真 ✦</div>
</div>

<div class="nav">
  <div class="nav-item active">招牌主食</div>
  <div class="nav-item">盖浇饭</div>
  <div class="nav-item">特色小吃</div>
  <div class="nav-item">风味烤串</div>
  <div class="nav-item">餐前小菜</div>
  <div class="nav-item">饮料</div>
</div>

<div class="vip-row">
  <div class="vip-card active"><div class="vip-name">靚仔卡</div><div class="vip-desc">95折</div></div>
  <div class="vip-card"><div class="vip-name">兄弟卡</div><div class="vip-desc">92折</div></div>
  <div class="vip-card"><div class="vip-name">姊妹卡</div><div class="vip-desc">92折</div></div>
  <div class="vip-card"><div class="vip-name">全家福</div><div class="vip-desc">88折</div></div>
</div>

<div class="combo-box">
  <div class="combo-title">🔥 推荐套餐</div>
  <div class="combo-item" onclick="alert('套餐A：牛肉面+小菜+饮料')">
    <span>套餐A（招牌牛肉面+凉菜+冰峰）</span>
    <strong style="color:#1e3a8a;">¥38</strong>
  </div>
  <div class="combo-item" onclick="alert('套餐B：烤串+主食')">
    <span>套餐B（烤串拼盘+盖饭）</span>
    <strong style="color:#1e3a8a;">¥52</strong>
  </div>
</div>

<div class="menu" id="menuList"></div>

<div class="checkout" onclick="alert('结算分单：\n面档：2件\n烤串：3件\n总计：¥86')">去结算 (¥86)</div>

<script>
// 37个完整菜品（无售罄，全部正常显示，价格按原价*1.3取整）
const menuData = [
  // 招牌主食 (12)
  { name: "招牌牛肉面", cat: "面档", price: 30 },
  { name: "青海鲜蔬牛肉凉面", cat: "面档", price: 28 },
  { name: "红烧牛肉面", cat: "面档", price: 30 },
  { name: "酸汤牛肉面", cat: "面档", price: 28 },
  { name: "干拌牛肉面", cat: "面档", price: 28 },
  { name: "羊肉泡馍", cat: "面档", price: 36 },
  { name: "清汤牛肉面", cat: "面档", price: 26 },
  { name: "辣子牛肉面", cat: "面档", price: 28 },
  { name: "西红柿鸡蛋面", cat: "面档", price: 22 },
  { name: "炸酱面", cat: "面档", price: 24 },
  { name: "羊杂汤面", cat: "面档", price: 32 },
  { name: "大宽牛肉面", cat: "面档", price: 32 },

  // 盖浇饭 (4)
  { name: "特色盖浇饭", cat: "盖饭", price: 26 },
  { name: "孜然牛肉盖饭", cat: "盖饭", price: 28 },
  { name: "红烧牛肉盖饭", cat: "盖饭", price: 28 },
  { name: "羊肉盖饭", cat: "盖饭", price: 32 },

  // 特色小吃 (6)
  { name: "凉拌牛肉", cat: "小吃", price: 32 },
  { name: "酿皮", cat: "小吃", price: 18 },
  { name: "甜醅", cat: "小吃", price: 16 },
  { name: "牛奶鸡蛋醪糟", cat: "小吃", price: 20 },
  { name: "手抓羊肉", cat: "小吃", price: 68 },
  { name: "东乡土豆片", cat: "小吃", price: 18 },

  // 风味烤串 (6)
  { name: "烤羊肉串", cat: "烤串", price: 8 },
  { name: "烤牛肉串", cat: "烤串", price: 8 },
  { name: "烤腰子", cat: "烤串", price: 15 },
  { name: "烤板筋", cat: "烤串", price: 10 },
  { name: "烤心管", cat: "烤串", price: 12 },
  { name: "烤馕", cat: "烤串", price: 10 },

  // 餐前小菜 (4)
  { name: "鸡蛋", cat: "小菜", price: 3 },
  { name: "小菜拼盘", cat: "小菜", price: 12 },
  { name: "凉拌木耳", cat: "小菜", price: 14 },
  { name: "拍黄瓜", cat: "小菜", price: 12 },

  // 饮料 (5)
  { name: "冰峰", cat: "饮品", price: 6 },
  { name: "酸梅汤", cat: "饮品", price: 8 },
  { name: "杏皮水", cat: "饮品", price: 8 },
  { name: "三泡台", cat: "饮品", price: 15 },
  { name: "现磨豆浆", cat: "饮品", price: 8 }
];

// 智能图片映射（防重复，美化）
function getImg(name) {
  const map = {
    "面": "beef-noodle-soup", "凉面": "cold-noodles", "泡馍": "lamb-soup",
    "盖饭": "rice-bowl", "烤": "grilled-skewers", "羊肉": "lamb-kebab",
    "牛肉": "beef-noodle", "凉拌": "cold-beef-salad", "酿皮": "asian-noodles",
    "甜醅": "sweet-dessert", "小菜": "side-dish", "鸡蛋": "boiled-egg",
    "冰峰": "soda-drink", "酸梅汤": "plum-drink", "杏皮水": "apricot-drink",
    "三泡台": "tea-cup", "饮料": "beverage", "大宽": "wide-noodle",
    "羊杂": "lamb-offal", "手抓": "hand-grabbed-lamb", "土豆": "fried-potato",
    "醪糟": "sweet-soup", "板筋": "grilled-tendon", "心管": "grilled-heart",
    "烤馕": "naan-bread", "木耳": "wood-ear", "黄瓜": "cucumber", "豆浆": "soy-milk"
  };
  let key = "chinese-halal-food";
  for (let k in map) if (name.includes(k)) key = map[k];
  return `https://image.pollinations.ai/prompt/${encodeURIComponent(key)}%2C%20appetizing%20chinese%20halal%20cuisine%2C%20high%20quality?width=200&height=200&nologo=true`;
}

// 渲染菜单
const list = document.getElementById("menuList");
menuData.forEach(m => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <img src="${getImg(m.name)}" class="card-img" onerror="this.src='https://image.pollinations.ai/prompt/chinese%20noodle%20food?width=200&height=200&nologo=true'">
    <div class="card-body">
      <div>
        <div class="card-title">${m.name} <span class="tag">${m.cat}</span></div>
        <div class="price-wrap">原价¥${Math.round(m.price/1.3)} <span class="price">¥${m.price}</span></div>
      </div>
      <button class="add-btn" onclick="alert('已加：${m.name}')">+</button>
    </div>
  `;
  list.appendChild(div);
});

// 交互
document.querySelectorAll(".vip-card").forEach(c => c.onclick = function() {
  document.querySelectorAll(".vip-card").forEach(x => x.classList.remove("active"));
  this.classList.add("active");
});
document.querySelectorAll(".nav-item").forEach(n => n.onclick = function() {
  document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("active"));
  this.classList.add("active");
});
</script>
</body>
</html>

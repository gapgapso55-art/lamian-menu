<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;color:#333}
.container{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;overflow-x:hidden;padding-bottom:80px}
.header{text-align:center;padding:15px;background:#fff}

.mascot-img{width:180px;height:auto;display:block;margin:0 auto}

.sales-box{background:#2a4d8f;color:#fff;padding:15px;text-align:center;border-radius:8px;margin:10px}
.sales-num{font-size:36px;font-weight:bold}
.shop-sales{font-size:12px;margin-top:10px}
.btn-group{display:flex;gap:10px;padding:10px;justify-content:center}
.btn{padding:8px 20px;border-radius:20px;border:1px solid #2a4d8f;background:#fff;color:#2a4d8f}
.btn.active{background:#2a4d8f;color:#fff}
.tabs{display:flex;gap:8px;padding:10px;overflow-x:auto;justify-content:center}
.tab{padding:6px 15px;border-radius:20px;border:1px solid #ccc;font-size:14px;white-space:nowrap}
.tab.active{background:#2a4d8f;color:#fff;border-color:#2a4d8f}
.cards{display:flex;gap:8px;padding:10px;overflow-x:auto;justify-content:center}
.card{padding:8px 15px;border:1px solid #2a4d8f;border-radius:8px;text-align:center;font-size:14px;white-space:nowrap}
.card.active{background:#2a4d8f;color:#fff}
.section{padding:15px}
.item{display:flex;align-items:center;padding:15px;border-bottom:1px solid #eee}
.item-img{width:50px;height:50px;background:#f0f0f0;border-radius:8px;margin-right:15px}
.item-info{flex:1}
.item-name{font-weight:bold;font-size:16px}
.item-price{color:#e74c3c;font-weight:bold}
.add-btn{width:35px;height:35px;background:#2a4d8f;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.checkout{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:90%;max-width:400px;background:#2a4d8f;color:#fff;padding:15px;border-radius:30px;text-align:center;font-size:18px;font-weight:bold;z-index:100}

<body><div class="container">
